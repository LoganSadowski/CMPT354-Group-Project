<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyte Detail</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #f4f7fb; color: #1f2937; }
        .page { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .card { background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 10px; box-sizing: border-box; }
        button { background: #2563eb; color: #fff; border: none; border-radius: 10px; padding: 11px 16px; cursor: pointer; }
        .error { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 10px; }
        .success { background: #dcfce7; color: #166534; padding: 10px; border-radius: 10px; }
        .badge { display: inline-block; background: #dbeafe; color: #1e3a8a; border-radius: 999px; padding: 2px 10px; font-size: 12px; }
        a { color: #1d4ed8; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="page">
        <div class="card">
            <h1>Analyte {{ analyte.analyteID }}</h1>
            <p>Measurements linked: <span class="badge">{{ measurement_count }}</span></p>

            {% if error %}<div class="error">{{ error }}</div>{% endif %}
            {% if action_message %}<div class="success">{{ action_message }}</div>{% endif %}

            <form method="post">
                <div class="grid">
                    <div>
                        <label for="name">Name</label>
                        <input id="name" name="name" value="{{ analyte.name }}" required>
                    </div>
                    <div>
                        <label for="defaultUnit">Default Unit</label>
                        <input id="defaultUnit" name="defaultUnit" value="{{ analyte.defaultUnit or '' }}" placeholder="e.g. ppm or %">
                    </div>
                    <div>
                        <label for="dataType">Data Type</label>
                        <input id="dataType" name="dataType" value="{{ analyte.dataType }}" required>
                    </div>
                </div>
                <button type="submit" style="margin-top: 12px;">Update Analyte</button>
            </form>

            <p style="margin-top: 14px;"><a href="/">Back to main page</a></p>
        </div>
    </div>
</body>
</html>
